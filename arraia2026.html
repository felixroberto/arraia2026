*{box-sizing:border-box;margin:0;padding:0}

.topo p{color:rgba(255,255,255,0.65);font-size:11px;margin-top:2px}
.edicao{background:rgba(243,156,18,0.85);color:#4A2800;font-size:10px;font-weight:600;padding:3px 10px;border-radius:10px;letter-spacing:.5px;white-space:nowrap}
.nav{display:flex;background:#2C1A0E;overflow-x:auto;-webkit-overflow-scrolling:touch}

.nav-btn i{display:block;font-size:18px;margin-bottom:2px}
.pg{display:none;padding:14px 16px;max-width:680px;margin:0 auto}
.pg.on{display:block}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid #F0E0C8;border-radius:10px;padding:12px 14px}
.kpi .kl{font-size:10px;color:#6B4226;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}

.sec{font-size:10px;font-weight:600;color:#6B4226;text-transform:uppercase;letter-spacing:.7px;margin:16px 0 8px;display:flex;align-items:center;gap:8px}

.card{background:#fff;border:1px solid #F0E0C8;border-radius:12px;padding:14px 16px;margin-bottom:10px}

.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.ri-info{flex:1;min-width:0}
.ri-nome{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#2C1A0E}
.ri-det{font-size:11px;color:#6B4226;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-acoes{display:flex;gap:4px;flex-shrink:0}
.btn-ic{width:30px;height:30px;border-radius:8px;border:1px solid #E0C9A8;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#6B4226;font-size:15px;transition:all .15s}

.badge{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:500;flex-shrink:0;white-space:nowrap}

.bd{background:#FCE7F3;color:#72243E}
.bm{background:#EEEDFE;color:#3C3489}
.bp{background:#EAF3DE;color:#27500A}

.busca-w{position:relative;margin-bottom:10px}

.pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}

.barra-seg{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin-top:8px}
.seg{height:100%;border-radius:2px;min-width:4px}
.dp-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.dp-label{font-size:12px;color:#6B4226}
.dp-val{font-size:12px;font-weight:600;color:#2C1A0E}
.dp-bar{height:6px;background:#EDE0CC;border-radius:3px;overflow:hidden;margin-bottom:10px}
.dp-fill{height:100%;border-radius:3px}
.alerta{background:#FEF3C7;border:1px solid #EF9F27;border-radius:8px;padding:10px 14px;font-size:12px;color:#633806;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.pub-destaque{text-align:center;background:#7D1C0A;border-radius:14px;padding:20px 16px;margin-bottom:12px}
.pub-destaque .pn{font-size:48px;font-weight:600;font-family:'Lora',serif;color:#F39C12;line-height:1}

.empty{text-align:center;padding:28px;color:#AAA;font-size:13px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#6B4226}
.leg-cor{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.form-check{display:flex;align-items:center;gap:8px;margin-bottom:14px;cursor:pointer}
.form-check span{font-size:12px;color:#6B4226}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2C1A0E;color:#F39C12;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}

const KEY='arraia2026';
function carregar(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):[...SEED]}catch(e){return[...SEED]}}
function salvarLS(){try{localStorage.setItem(KEY,JSON.stringify(lista))}catch(e){}}

let lista=carregar();
let nextId=Math.max(...lista.map(d=>d.id),99)+1;
let filtro='todos';
let editId=null;

function calc(){
  const tot=lista.reduce((a,c)=>a+c.pessoas,0);
  const cri=lista.reduce((a,c)=>a+c.criancas,0);
  const contrib=lista.reduce((a,c)=>a+c.contrib,0);
  const comPrato=lista.filter(d=>d.prato).length;
  const sal=lista.filter(d=>d.tipo==='SALGADO'&&d.prato).length;
  const doc=lista.filter(d=>d.tipo==='DOCE'&&d.prato).length;
  const mis=lista.filter(d=>d.tipo==='MISTO'&&d.prato).length;
  const pgQtd=lista.filter(d=>d.pg).length;
  return{tot,cri,adultos:tot-cri,contrib,comPrato,semPrato:lista.length-comPrato,sal,doc,mis,pgQtd,grupos:lista.length};
}

function badgeTipo(tipo){
  if(tipo==='SALGADO') return '<span class="badge bs">Salgado</span>';
  if(tipo==='DOCE') return '<span class="badge bd">Doce</span>';
  if(tipo==='MISTO') return '<span class="badge bm">Misto</span>';
  return '';
}

    <div class="grid2">

      <div class="kpi amar"><div class="kl">Média por grupo</div><div class="kv">${s.pgQtd>0?fmt(Math.round(s.contrib/s.pgQtd)):'R$ 0'}</div><div class="ks">entre quem pagou</div></div>

    <div class="sec">Pratos</div>

      <div class="kpi verd"><div class="kl">Com prato</div><div class="kv">${s.comPrato}</div><div class="ks">${pctPrato}% dos grupos</div></div>
      <div class="kpi verm"><div class="kl">Sem prato</div><div class="kv">${s.semPrato}</div><div class="ks">aguardando</div></div>
    </div>
    ${s.semPrato>0?`<div class="alerta"><i class="ti ti-alert-triangle"></i>${s.semPrato} grupo${s.semPrato>1?'s':''} ainda sem prato confirmado</div>`:''}

      </div>
    </div>`;

function renderLista(){
  const busca=document.getElementById('buscaLista')?.value||'';
  let fl=lista.filter(d=>{
    const ok=d.nome.toLowerCase().includes(busca.toLowerCase());
    if(filtro==='com-prato') return ok&&d.prato;
    if(filtro==='sem-prato') return ok&&!d.prato;
    if(filtro==='criancas') return ok&&d.criancas>0;
    if(filtro==='pg') return ok&&d.pg;
    return ok;
  });

    <div class="busca-w">
      <i class="ti ti-search"></i>
      <input type="text" id="buscaLista" placeholder="Buscar convidado..." value="${busca.replace(/"/g,'&quot;')}" oninput="renderLista()">
    </div>
    <div class="pills">
      <button class="pill ${filtro==='todos'?'on':''}" onclick="setFiltro('todos')">Todos (${lista.length})</button>
      <button class="pill ${filtro==='com-prato'?'on':''}" onclick="setFiltro('com-prato')">Com prato</button>
      <button class="pill ${filtro==='sem-prato'?'on':''}" onclick="setFiltro('sem-prato')">Sem prato</button>
      <button class="pill ${filtro==='criancas'?'on':''}" onclick="setFiltro('criancas')">Com crianças</button>
      <button class="pill ${filtro==='pg'?'on':''}" onclick="setFiltro('pg')">Pagando</button>
    </div>
    ${fl.length===0?'<div class="empty">Nenhum convidado encontrado</div>':
      fl.map(d=>{
        const idx=lista.indexOf(d);
        const cor=corAv(idx);
        const pgB=d.pg&&d.contrib>0?`<span class="badge bp">PG ${fmt(d.contrib)}</span>`:(d.pg?'<span class="badge bp">PG</span>':'');
        return`<div class="row-item">
          <div class="av" style="background:${cor}22;color:${cor}">${ini(d.nome)}</div>
          <div class="ri-info">
            <div class="ri-nome">${d.nome}</div>
            <div class="ri-det">${d.pessoas} pessoa${d.pessoas>1?'s':''}${d.criancas?' · '+d.criancas+' criança'+(d.criancas>1?'s':''):''}${d.prato?' · '+d.prato:''}</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:3px;align-items:flex-end;flex-shrink:0">
            ${pgB}${d.prato?badgeTipo(d.tipo):'<span class="badge bn">Sem prato</span>'}
          </div>
          <div class="ri-acoes">
            <button class="btn-ic" onclick="abrirEdit(${d.id})" title="Editar"><i class="ti ti-edit"></i></button>
            <button class="btn-ic del" onclick="excluir(${d.id})" title="Excluir"><i class="ti ti-trash"></i></button>
          </div>
        </div>`;
      }).join('')}`;
}

function setFiltro(f){filtro=f;renderLista()}

function renderCad(v){
  v=v||{};
  document.getElementById('pg-cad').innerHTML=`
    <div class="card">
      <div style="font-size:15px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px;color:#2C1A0E">
        <i class="ti ti-user-plus" style="color:#B5290F;font-size:18px"></i>
        ${editId?'Editar convidado':'Novo convidado'}
      </div>
      <label>Nome / grupo *</label>
      <input type="text" id="f-nome" placeholder="Ex: João + Maria + Filhos" value="${(v.nome||'').replace(/"/g,'&quot;')}">
      <div class="form-row">
        <div><label>Número de pessoas</label><input type="number" id="f-pessoas" min="1" value="${v.pessoas||1}"></div>
        <div><label>Crianças (até 12 anos)</label><input type="number" id="f-criancas" min="0" value="${v.criancas||0}"></div>
      </div>
      <label>Prato que vai trazer</label>
      <input type="text" id="f-prato" placeholder="Ex: Bolo de fubá, Caldo verde..." value="${(v.prato||'').replace(/"/g,'&quot;')}">
      <label>Tipo do prato</label>
      <select id="f-tipo">
        <option value="">Selecione</option>
        <option value="SALGADO" ${(v.tipo||'')==='SALGADO'?'selected':''}>Salgado</option>
        <option value="DOCE" ${(v.tipo||'')==='DOCE'?'selected':''}>Doce</option>
        <option value="MISTO" ${(v.tipo||'')==='MISTO'?'selected':''}>Misto (salgado + doce)</option>
      </select>
      <label>Contribuição (R$)</label>
      <input type="number" id="f-contrib" min="0" value="${v.contrib||0}" placeholder="0">
      <label class="form-check">
        <input type="checkbox" id="f-pg" ${v.pg?'checked':''}>
        <span>Confirmou pagamento</span>
      </label>
      <button class="btn-prim" onclick="salvarConv()">${editId?'Salvar alterações':'Confirmar convidado'}</button>
      ${editId?`<button class="btn-sec" onclick="cancelarEdit()">Cancelar</button>`:''}
    </div>`;
}

function salvarConv(){
  const nome=document.getElementById('f-nome').value.trim();
  if(!nome){alert('Informe o nome do grupo');return}
  const obj={
    nome,
    pessoas:parseInt(document.getElementById('f-pessoas').value)||1,
    criancas:parseInt(document.getElementById('f-criancas').value)||0,
    prato:document.getElementById('f-prato').value.trim(),
    tipo:document.getElementById('f-tipo').value,
    contrib:parseInt(document.getElementById('f-contrib').value)||0,
    pg:document.getElementById('f-pg').checked
  };
  if(editId){
    const idx=lista.findIndex(d=>d.id===editId);
    if(idx>=0) lista[idx]={...lista[idx],...obj};
    editId=null;
    toast('Convidado atualizado!');
  } else {
    obj.id=nextId++;
    lista.push(obj);
    toast('Convidado adicionado!');
  }
  salvarLS();
  renderAll();
  ir('lista');
}

function abrirEdit(id){
  const d=lista.find(x=>x.id===id);
  if(!d) return;
  editId=id;
  renderCad(d);
  ir('cad');
}

function cancelarEdit(){editId=null;renderCad();ir('lista')}

function excluir(id){
  if(!confirm('Excluir este convidado?')) return;
  lista=lista.filter(d=>d.id!==id);
  salvarLS();
  renderAll();
  renderLista();
  toast('Convidado removido');
}

function renderPratos(){
  const s=calc();
  const comPrato=lista.filter(d=>d.prato).sort((a,b)=>{const o={SALGADO:0,MISTO:1,DOCE:2,'':3};return(o[a.tipo]||3)-(o[b.tipo]||3)});
  const semPrato=lista.filter(d=>!d.prato);
  document.getElementById('pg-pratos').innerHTML=`
    <div class="grid2">
      <div class="kpi verm"><div class="kl">Salgados</div><div class="kv">${s.sal}</div></div>
      <div class="kpi" style=""><div class="kl">Doces</div><div class="kv" style="color:#993556">${s.doc}</div></div>
      <div class="kpi roxo"><div class="kl">Mistos</div><div class="kv">${s.mis}</div></div>
      <div class="kpi"><div class="kl">Sem prato</div><div class="kv" style="color:#A32D2D">${s.semPrato}</div></div>
    </div>
    <div class="sec">Pratos confirmados (${comPrato.length})</div>
    ${comPrato.map(d=>{
      let cor='#BDC3C7';
      if(d.tipo==='SALGADO') cor='#E67E22';
      else if(d.tipo==='DOCE') cor='#D4537E';
      else if(d.tipo==='MISTO') cor='#7F77DD';
      return`<div class="row-item">
        <div style="width:5px;height:38px;border-radius:3px;background:${cor};flex-shrink:0"></div>
        <div class="ri-info"><div class="ri-nome">${d.prato}</div><div class="ri-det">${d.nome}</div></div>
        ${badgeTipo(d.tipo)}
      </div>`;
    }).join('')}
    ${semPrato.length>0?`
    <div class="sec">Aguardando prato (${semPrato.length})</div>
    ${semPrato.map(d=>`<div class="row-item" style="opacity:.65">
      <div style="width:5px;height:38px;border-radius:3px;background:#DDD;flex-shrink:0"></div>
      <div class="ri-info"><div class="ri-nome">${d.nome}</div><div class="ri-det">${d.pessoas} pessoa${d.pessoas>1?'s':''}</div></div>
      <span class="badge bpend">Pendente</span>
      <button class="btn-ic" onclick="abrirEdit(${d.id})" title="Editar"><i class="ti ti-edit"></i></button>
    </div>`).join('')}`:''}`;
}

function renderPub(){
  const s=calc();
  const pctA=s.tot>0?Math.round(s.adultos/s.tot*100):0;
  const pctC=s.tot>0?Math.round(s.criancas/s.tot*100):0;
  const tot=s.sal+s.doc+s.mis||1;
  document.getElementById('pg-pub').innerHTML=`
    <div class="pub-destaque">
      <div class="pn">${s.tot}</div>
      <div class="pl">pessoas confirmadas no arraiá!</div>
    </div>
    <div class="grid2" style="margin-bottom:12px">
      <div class="kpi verd"><div class="kl">Grupos confirmados</div><div class="kv">${s.grupos}</div></div>
      <div class="kpi amar"><div class="kl">Pratos confirmados</div><div class="kv">${s.comPrato}</div></div>
    </div>
    <div class="card">
      <div style="font-size:12px;font-weight:600;margin-bottom:10px">Quem vem ao arraiá</div>
      <div class="dp-row"><div class="dp-label">Adultos</div><div class="dp-val">${s.adultos} (${pctA}%)</div></div>
      <div class="dp-bar"><div class="dp-fill" style="width:${pctA}%;background:#B5290F"></div></div>
      <div class="dp-row"><div class="dp-label">Crianças</div><div class="dp-val">${s.criancas} (${pctC}%)</div></div>
      <div class="dp-bar"><div class="dp-fill" style="width:${pctC}%;background:#3B6D11"></div></div>
    </div>
    <div class="card">
      <div style="font-size:12px;font-weight:600;margin-bottom:10px">Mesa do arraiá</div>
      <div class="dp-row"><div class="dp-label">Pratos salgados</div><div class="dp-val">${s.sal} (${Math.round(s.sal/tot*100)}%)</div></div>
      <div class="dp-bar"><div class="dp-fill" style="width:${Math.round(s.sal/tot*100)}%;background:#E67E22"></div></div>
      <div class="dp-row"><div class="dp-label">Pratos doces</div><div class="dp-val">${s.doc} (${Math.round(s.doc/tot*100)}%)</div></div>
      <div class="dp-bar"><div class="dp-fill" style="width:${Math.round(s.doc/tot*100)}%;background:#D4537E"></div></div>
      <div class="dp-row"><div class="dp-label">Pratos mistos</div><div class="dp-val">${s.mis} (${Math.round(s.mis/tot*100)}%)</div></div>
      <div class="dp-bar"><div class="dp-fill" style="width:${Math.round(s.mis/tot*100)}%;background:#7F77DD"></div></div>
    </div>
    <div style="text-align:center;padding:8px 0 4px;font-size:11px;color:#AAA">Vista pública · sem informações financeiras</div>`;
}

function renderAll(){renderDash();renderPratos();renderPub()}

function ir(pg){
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('pg-'+pg).classList.add('on');
  const m={dash:0,lista:1,cad:2,pratos:3,pub:4};
  if(m[pg]!==undefined) document.querySelectorAll('.nav-btn')[m[pg]]?.classList.add('on');
  if(pg==='cad'&&!editId) renderCad();
  if(pg==='lista') renderLista();
  if(pg==='dash') renderDash();
  if(pg==='pratos') renderPratos();
  if(pg==='pub') renderPub();
}

renderAll();renderCad();renderLista();
</script>
</body>
</html>
