function calc(){
  const tot=lista.reduce((a,c)=>a+c.pessoas,0);
  const cri=lista.reduce((a,c)=>a+c.criancas,0);
  const contrib=lista.reduce((a,c)=>a+c.contrib,0);
  const comPrato=lista.filter(d=>d.prato).length;
  const sal=lista.filter(d=>d.tipo==='SALGADO'&&d.prato).length;
  const doc=lista.filter(d=>d.tipo==='DOCE'&&d.prato).length;
  const mis=lista.filter(d=>d.tipo==='MISTO'&&d.prato).length;
  const pgQtd=lista.filter(d=>d.pg).length;
  const totalChopp=lista.reduce((a,c)=>a+(c.chopp||0),0);
  const gruposChopp=lista.filter(d=>d.chopp>0).length;
  return{tot,cri,adultos:tot-cri,contrib,comPrato,semPrato:lista.length-comPrato,sal,doc,mis,pgQtd,grupos:lista.length,totalChopp,gruposChopp};
}

  if(tipo==='MISTO') return '<span class="badge bm">Misto</span>';
  return '';
}


function pizzaSVG(slices, size){
  const id='pz'+Math.random().toString(36).slice(2,8);
  const total=slices.reduce((a,c)=>a+c.val,0);
  const html='<canvas id="'+id+'" width="'+(size*2)+'" height="'+(size*2)+'" style="width:'+size+'px;height:'+size+'px;display:block;margin:0 auto 8px"></canvas>';
  setTimeout(()=>{
    const cv=document.getElementById(id);
    if(!cv) return;
    const ctx=cv.getContext('2d');
    const s2=size*2, cx=s2/2, cy=s2/2, r=s2/2-8;
    ctx.clearRect(0,0,s2,s2);
    if(!total){ctx.fillStyle='#EDE0CC';ctx.beginPath();ctx.arc(cx,cy,r,0,2*Math.PI);ctx.fill();return;}
    let angle=-Math.PI/2;
    slices.forEach(sl=>{
      if(!sl.val) return;
      const sweep=(sl.val/total)*2*Math.PI;
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,r,angle,angle+sweep);
      ctx.closePath();
      ctx.fillStyle=sl.color;
      ctx.fill();
      ctx.strokeStyle='#FFF9F0';
      ctx.lineWidth=3;
      ctx.stroke();
      angle+=sweep;
    });
  },50);
  return html;
}

function salvarConv(){
  const nome=document.getElementById('f-nome').value.trim();
  if(!nome){alert('Informe o nome do grupo');return}
  const obj={
    nome,
    pessoas:parseInt(document.getElementById('f-pessoas').value)||1,
    criancas:parseInt(document.getElementById('f-criancas').value)||0,
    prato:document.getElementById('f-prato').value.trim(),
    tipo:document.getElementById('f-tipo').value,
    contrib:parseInt(document.getElementById('f-contrib').value)||0,
    pg:document.getElementById('f-pg').checked,
    chopp:parseInt(document.getElementById('f-chopp').value)||0,
    choppPago:document.getElementById('f-chopp-pago').value==='1'
  };
  if(editId){
    const idx=lista.findIndex(d=>d.id===editId);
    if(idx>=0) lista[idx]={...lista[idx],...obj};
    editId=null;
    toast('Convidado atualizado!');
  } else {
    obj.id=nextId++;
    lista.push(obj);
    toast('Convidado adicionado!');
  }
  salvarLS();renderAll();ir('lista');
}

  if(!id){alert('Selecione o grupo');return}
  const idx=lista.findIndex(d=>d.id===id);
  if(idx>=0){lista[idx].chopp=qtd;salvarLS();renderAll();toast('Chopp atualizado!');}
  renderCad();renderChopp();
}

function gerarPDF(){
  toast('Preparando PDF...');
  setTimeout(async ()=>{
    try{
      const {jsPDF}=window.jspdf;
      const pw=210, gap=8;
      const el1=document.getElementById('pub-captura');
      const el2=document.getElementById('pub-captura2');

      // capturar ambos os blocos
      const c1=await html2canvas(el1,{scale:2,backgroundColor:'#FFF9F0',useCORS:true,allowTaint:true,logging:false});
      const c2=await html2canvas(el2,{scale:2,backgroundColor:'#FFF9F0',useCORS:true,allowTaint:true,logging:false});

      // calcular alturas proporcionais ao A4 (210mm)
      const margin=10;
      const usable=pw-margin*2;

      const h1=Math.round((c1.height/c1.width)*usable);
      const h2=Math.round((c2.height/c2.width)*usable);

      // altura total do PDF
      const totalH=margin+h1+gap+h2+margin;

      const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:[pw,totalH]});

      // fundo creme
      pdf.setFillColor(255,249,240);
      pdf.rect(0,0,pw,totalH,'F');

      // bandeirinha no topo
      const banCores=['#C0392B','#F39C12','#27AE60','#2980B9','#8E44AD'];
      banCores.forEach((c,i)=>{
        pdf.setFillColor(...hexToRgb(c));
        pdf.rect(i*(pw/banCores.length),0,pw/banCores.length,3,'F');
      });

      // cabeçalho
      pdf.setFillColor(122,92,16);
      pdf.roundedRect(margin,4,usable,14,3,3,'F');
      pdf.setFontSize(11);
      pdf.setTextColor(255,255,255);
      pdf.setFont('helvetica','bold');
      pdf.text('Arraiá dos Amigos · Felix & Warley · 5ª edição · 2026',pw/2,12.5,{align:'center'});

      // imagem 1
      const img1=c1.toDataURL('image/png');
      pdf.addImage(img1,'PNG',margin,20,usable,h1);

      // separador
      pdf.setFillColor(240,224,200);
      pdf.rect(margin,20+h1+2,usable,0.5,'F');

      // imagem 2
      const img2=c2.toDataURL('image/png');
      pdf.addImage(img2,'PNG',margin,20+h1+gap,usable,h2);

      // rodapé
      const rodapeY=20+h1+gap+h2+4;
      pdf.setFontSize(8);
      pdf.setTextColor(107,66,38);
      pdf.setFont('helvetica','normal');
      pdf.text('Arraiá dos Amigos F&W 2026  ·  04/07/2026 a partir das 15h  ·  Gerado em '+new Date().toLocaleDateString('pt-BR'),pw/2,rodapeY,{align:'center'});

      // bandeirinha no rodapé
      banCores.forEach((c,i)=>{
        pdf.setFillColor(...hexToRgb(c));
        pdf.rect(i*(pw/banCores.length),totalH-3,pw/banCores.length,3,'F');
      });

      pdf.save('arraia2026-completo.pdf');
      toast('PDF salvo!');
    }catch(e){
      console.error(e);
      toast('Erro ao gerar PDF');
    }
  },400);
}

function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  return [r,g,b];
}

function tickTimer(){
  function pad(n){return String(n).padStart(2,'0')}
  const ev=new Date('2026-07-04T15:00:00');
  const diff=ev-new Date();
  const eh=document.getElementById('thh');
  const em=document.getElementById('tmm');
  const es=document.getElementById('tss');
  if(!eh||!em||!es) return;
  if(diff<=0){eh.textContent='00';em.textContent='00';es.textContent='00';return;}
  eh.textContent=pad(Math.floor(diff/3600000)%24);
  em.textContent=pad(Math.floor(diff/60000)%60);
  es.textContent=pad(Math.floor(diff/1000)%60);
}

  document.getElementById('pg-'+pg).classList.add('on');
  const m={dash:0,lista:1,cad:2,pratos:3,chopp:4,pub:5};
  if(m[pg]!==undefined) document.querySelectorAll('.nav-btn')[m[pg]]?.classList.add('on');
  if(pg==='cad'&&!editId) renderCad();
  if(pg==='lista') renderLista();
  if(pg==='dash') renderDash();
  if(pg==='pratos') renderPratos();
  if(pg==='chopp') renderChopp();
  if(pg==='pub'){renderPub();setTimeout(tickTimer,50);}
}

renderAll();renderCad();renderLista();
</script>
</body>
</html>
